# Alerts go by email through iCloud SMTP. Put an app-specific password
# (appleid.apple.com → Sign-In and Security → App-Specific Passwords)
# into ops/monitoring/secrets/smtp_password.
global:
  smtp_smarthost: smtp.mail.me.com:587
  smtp_from: s_pavlyuk1@icloud.com
  smtp_auth_username: s_pavlyuk1@icloud.com
  smtp_auth_password_file: /etc/alertmanager/smtp_password
  smtp_require_tls: true

route:
  receiver: email
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: email
      repeat_interval: 1h

receivers:
  - name: email
    email_configs:
      - to: s_pavlyuk1@icloud.com
        send_resolved: true
