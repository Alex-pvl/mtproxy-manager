services:
  fragment-worker:
    build: .
    container_name: fragment-worker
    restart: unless-stopped
    # Биндимся ТОЛЬКО на 127.0.0.1 — снаружи воркер не должен быть виден
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - FRAGMENT_WORKER_TOKEN=${FRAGMENT_WORKER_TOKEN}
      - WALLET_MNEMONIC=${WALLET_MNEMONIC}
      - FRAGMENT_COOKIES=${FRAGMENT_COOKIES}
      - TG_API_ID=${TG_API_ID}
      - TG_API_HASH=${TG_API_HASH}
